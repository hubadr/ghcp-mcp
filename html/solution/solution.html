<!-- Polaroid Image Gallery -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaroid Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header Styles */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* CSS-only Navigation — no JavaScript needed */
        .nav-container {
            position: relative;
        }

        .nav-trigger {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            user-select: none;
        }

        .nav-trigger:hover,
        .nav-trigger:focus {
            background: #764ba2;
            transform: translateY(-2px);
            outline: none;
        }

        .nav-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 0;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
            min-width: 150px;
        }

        /* Show menu on hover over the container OR when trigger has focus */
        .nav-container:hover .nav-menu,
        .nav-container:focus-within .nav-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .nav-menu ul {
            list-style: none;
            padding: 0.5rem 0;
        }

        .nav-menu a {
            display: block;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            color: #333;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .nav-menu a:hover,
        .nav-menu a:focus {
            background: #f0f0f0;
            color: #667eea;
            outline: none;
        }

        /* Main Content */
        main {
            padding: 3rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-title {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Polaroid Gallery Grid — always exactly 3 columns */
        .polaroid-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .polaroid {
            background: white;
            padding: 1rem;
            padding-bottom: 2rem;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .polaroid:nth-child(odd) {
            transform: rotate(-2deg);
        }

        .polaroid:nth-child(even) {
            transform: rotate(1deg);
        }

        .polaroid:nth-child(3n) {
            transform: rotate(-1deg);
        }

        .polaroid:hover {
            transform: scale(1.05) rotate(0deg) !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .polaroid img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 3px;
            display: block;
        }

        .polaroid-caption {
            margin-top: 1rem;
            text-align: center;
            font-size: 1rem;
            color: #333;
            font-style: italic;
        }

        /* Footer */
        footer {
            background: rgba(0, 0, 0, 0.8);
            overflow: hidden;
            position: relative;
            height: 120px;
        }

        .flying-text {
            position: absolute;
            white-space: nowrap;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            animation: flyText 18s linear infinite;
            top: 70%;
            transform: translateY(-50%);
        }

        .nyan-cat {
            position: absolute;
            width: 150px;
            height: 100px;
            background-image: url('https://media.tenor.com/E3MLgDP1qoQAAAAi/nyan-cat-transparent.gif');
            background-size: contain;
            background-repeat: no-repeat;
            animation: flyNyanCat 10s linear infinite;
            top: 30%;
            transform: translateY(-50%);
            z-index: 10;
        }

        @keyframes flyNyanCat {
            from {
                transform: translateX(-160px) translateY(-50%);
            }
            to {
                transform: translateX(100vw) translateY(-50%);
            }
        }

        @keyframes flyText {
            from {
                transform: translateX(-100%) translateY(-50%);
            }
            to {
                transform: translateX(100vw) translateY(-50%);
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <!-- CSS-only pop-up navigation in the top-left corner -->
            <nav class="nav-container" aria-label="Main navigation">
                <span class="nav-trigger" tabindex="0" role="button" aria-haspopup="true">Menu ▼</span>
                <div class="nav-menu" role="menu">
                    <ul>
                        <li><a href="#" role="menuitem">Nav1</a></li>
                        <li><a href="#" role="menuitem">Nav2</a></li>
                        <li><a href="#" role="menuitem">Nav3</a></li>
                    </ul>
                </div>
            </nav>
            <div class="logo">📸 Polaroid Gallery</div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <h1 class="gallery-title">My Polaroid Collection</h1>

        <!-- 3×3 Polaroid Grid -->
        <div class="polaroid-grid">
            <div class="polaroid" onclick="playRickroll()">
                <img src="https://picsum.photos/seed/gallery1/300/250" alt="Random Image 1">
                <div class="polaroid-caption">Summer Vibes</div>
            </div>
            <div class="polaroid" onclick="playRickroll()">
                <img src="https://picsum.photos/seed/gallery2/300/250" alt="Random Image 2">
                <div class="polaroid-caption">City Lights</div>
            </div>
            <div class="polaroid" onclick="playRickroll()">
                <img src="https://picsum.photos/seed/gallery3/300/250" alt="Random Image 3">
                <div class="polaroid-caption">Nature's Beauty</div>
            </div>
            <div class="polaroid" onclick="playRickroll()">
                <img src="https://picsum.photos/seed/gallery4/300/250" alt="Random Image 4">
                <div class="polaroid-caption">Ocean Waves</div>
            </div>
            <div class="polaroid" onclick="playRickroll()">
                <img src="https://picsum.photos/seed/gallery5/300/250" alt="Random Image 5">
                <div class="polaroid-caption">Mountain Peak</div>
            </div>
            <div class="polaroid" onclick="playRickroll()">
                <img src="https://picsum.photos/seed/gallery6/300/250" alt="Random Image 6">
                <div class="polaroid-caption">Urban Art</div>
            </div>
            <div class="polaroid" onclick="playRickroll()">
                <img src="https://picsum.photos/seed/gallery7/300/250" alt="Random Image 7">
                <div class="polaroid-caption">Sunset Dreams</div>
            </div>
            <div class="polaroid" onclick="playRickroll()">
                <img src="https://picsum.photos/seed/gallery8/300/250" alt="Random Image 8">
                <div class="polaroid-caption">Forest Path</div>
            </div>
            <div class="polaroid" onclick="playRickroll()">
                <img src="https://picsum.photos/seed/gallery9/300/250" alt="Random Image 9">
                <div class="polaroid-caption">Starry Night</div>
            </div>
        </div>
    </main>

    <!-- Footer with looping nyan-cat animation -->
    <footer>
        <div class="nyan-cat"></div>
        <div class="flying-text">✨ Amazing Polaroid Gallery ✨ Perfect for Memories ✨ Click a photo for a surprise! ✨</div>
    </footer>

    <!-- Minimal JavaScript: rickroll audio on image click only -->
    <script>
        (function () {
            var audio = new Audio("https://media.memesoundeffects.com/2023/03/Rick-Roll-Sound-djlunatique.com_.mp3");
            audio.volume = 0.7;
            window.playRickroll = function () {
                audio.currentTime = 0;
                audio.play().catch(function () {});
            };
        }());
    </script>
</body>

</html>
